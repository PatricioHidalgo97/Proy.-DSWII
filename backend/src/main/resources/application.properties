spring.application.name=sistema-gestion
server.port=${SERVER_PORT:9090}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_gestion?createDatabaseIfNotExist=true&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:SistemaGestionCibertec2026ClaveSeguraJWT123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:4200}

app.admin.usuario=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:Admin123*}
app.admin.nombres=${ADMIN_NAMES:Administrador}
app.admin.apellidos=${ADMIN_LASTNAMES:General}
app.operator.usuario=${OPERATOR_USER:caja}
app.operator.password=${OPERATOR_PASSWORD:Caja123*}
app.operator.nombres=${OPERATOR_NAMES:Operador}
app.operator.apellidos=${OPERATOR_LASTNAMES:Caja}

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
