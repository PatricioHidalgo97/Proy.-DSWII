# api-gateway — configuración base (ESP-07 §5, ESP-02 §3)
spring.application.name=api-gateway

# Puerto configurable (PORT-GW)
server.port=${GATEWAY_PORT:9101}

# Actuator: health y gateway (ESP-07 §7)
management.endpoints.web.exposure.include=health,gateway
management.endpoint.health.show-details=always

# ---------------------------------------------------------------------------
# Rutas (ESP-07 §4, ESP-04 §3)
#
# Hay una ruta por cada prefijo de ESP-04 §3 más la ruta transitoria al
# monolito: once entradas en total en /actuator/gateway/routes.
#
# No se usa StripPrefix: los servicios conservan sus rutas /api/... (ESP-07 §4.1).
# El orden es explícito y creciente: los prefijos específicos se evalúan antes
# que la ruta comodín `monolito`.
#
# ESTADO 3 (PLAN-04, ESP-11 §7 Fase 3): cobranza ya vive en cash-service.
#   IDENTITY_URL=http://localhost:9102  (PLAN-02, activo)
#   CATALOG_URL=http://localhost:9103   (PLAN-03, valor por defecto)
#   CASH_URL=http://localhost:9104      (PLAN-04: cuentas y recibos)
#   MONOLITO_URL=http://localhost:9090  (egresos y reportes hasta PLAN-05)
#
# `egresos` y `reportes` siguen en el monolito y por eso usan MONOLITO_URL, no
# CASH_URL: compartir CASH_URL habría mandado también esas dos rutas a
# cash-service (9104), que todavía no las implementa. En PLAN-05 se mueven a
# CASH_URL y MONOLITO_URL queda solo para la ruta comodín `monolito`.
# ---------------------------------------------------------------------------

# --- identity-service (/api/auth/**) ---
spring.cloud.gateway.server.webmvc.routes[0].id=identity
spring.cloud.gateway.server.webmvc.routes[0].uri=${IDENTITY_URL:http://localhost:9090}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webmvc.routes[0].order=10
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=RemoveRequestHeader=Origin

# --- catalog-service: socios, giros, puestos, servicios, bancos ---
spring.cloud.gateway.server.webmvc.routes[1].id=socios
spring.cloud.gateway.server.webmvc.routes[1].uri=${CATALOG_URL:http://localhost:9103}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/socios/**
spring.cloud.gateway.server.webmvc.routes[1].order=20
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=RemoveRequestHeader=Origin

spring.cloud.gateway.server.webmvc.routes[2].id=giros
spring.cloud.gateway.server.webmvc.routes[2].uri=${CATALOG_URL:http://localhost:9103}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/giros/**
spring.cloud.gateway.server.webmvc.routes[2].order=21
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=RemoveRequestHeader=Origin

spring.cloud.gateway.server.webmvc.routes[3].id=puestos
spring.cloud.gateway.server.webmvc.routes[3].uri=${CATALOG_URL:http://localhost:9103}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/puestos/**
spring.cloud.gateway.server.webmvc.routes[3].order=22
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=RemoveRequestHeader=Origin

spring.cloud.gateway.server.webmvc.routes[4].id=servicios
spring.cloud.gateway.server.webmvc.routes[4].uri=${CATALOG_URL:http://localhost:9103}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/servicios/**
spring.cloud.gateway.server.webmvc.routes[4].order=23
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=RemoveRequestHeader=Origin

spring.cloud.gateway.server.webmvc.routes[5].id=bancos
spring.cloud.gateway.server.webmvc.routes[5].uri=${CATALOG_URL:http://localhost:9103}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/bancos/**
spring.cloud.gateway.server.webmvc.routes[5].order=24
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=RemoveRequestHeader=Origin

# --- cash-service: cuentas y recibos (PLAN-04) ---
spring.cloud.gateway.server.webmvc.routes[6].id=cuentas
spring.cloud.gateway.server.webmvc.routes[6].uri=${CASH_URL:http://localhost:9104}
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/cuentas/**
spring.cloud.gateway.server.webmvc.routes[6].order=30
spring.cloud.gateway.server.webmvc.routes[6].filters[0]=RemoveRequestHeader=Origin

spring.cloud.gateway.server.webmvc.routes[7].id=recibos
spring.cloud.gateway.server.webmvc.routes[7].uri=${CASH_URL:http://localhost:9104}
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/api/recibos/**
spring.cloud.gateway.server.webmvc.routes[7].order=31
spring.cloud.gateway.server.webmvc.routes[7].filters[0]=RemoveRequestHeader=Origin

# --- monolito: egresos y reportes hasta PLAN-05 ---
# Usan MONOLITO_URL (9090) y NO CASH_URL: cash-service aún no implementa esos
# prefijos, y compartir la variable los habría enrutado al puerto 9104.
# En PLAN-05 pasan a CASH_URL y esta variable queda solo para la ruta comodín.
spring.cloud.gateway.server.webmvc.routes[8].id=egresos
spring.cloud.gateway.server.webmvc.routes[8].uri=${MONOLITO_URL:http://localhost:9090}
spring.cloud.gateway.server.webmvc.routes[8].predicates[0]=Path=/api/egresos/**
spring.cloud.gateway.server.webmvc.routes[8].order=32
spring.cloud.gateway.server.webmvc.routes[8].filters[0]=RemoveRequestHeader=Origin

spring.cloud.gateway.server.webmvc.routes[9].id=reportes
spring.cloud.gateway.server.webmvc.routes[9].uri=${MONOLITO_URL:http://localhost:9090}
spring.cloud.gateway.server.webmvc.routes[9].predicates[0]=Path=/api/reportes/**
spring.cloud.gateway.server.webmvc.routes[9].order=33
spring.cloud.gateway.server.webmvc.routes[9].filters[0]=RemoveRequestHeader=Origin

# --- Respaldo transitorio al monolito (R-11) ---
# Ruta comodín para todo lo que aún no se ha extraído. Es la última: su order
# es mayor que el de cualquier ruta de dominio, así que los prefijos
# específicos siempre ganan. Desde PLAN-03 los cinco prefijos de catálogo
# (socios, giros, puestos, servicios, bancos) tienen order 20-24; desde PLAN-04
# lo mismo ocurre con cuentas y recibos (order 30-31).
# El predicado excluye explícitamente cuentas y recibos para que el respaldo no
# pueda absorberlos aunque cambie el orden de las rutas (PLAN-04 T-07 §2).
# TODO(PLAN-05): eliminar esta ruta al cerrar la extracción de caja.
spring.cloud.gateway.server.webmvc.routes[10].id=monolito
spring.cloud.gateway.server.webmvc.routes[10].uri=${MONOLITO_URL:http://localhost:9090}
spring.cloud.gateway.server.webmvc.routes[10].predicates[0]=Path=/api/{segment:^(?!cuentas$|recibos$).*}/**
spring.cloud.gateway.server.webmvc.routes[10].order=100
spring.cloud.gateway.server.webmvc.routes[10].filters[0]=RemoveRequestHeader=Origin
