# cash-service — configuración base (ESP-02 §3, ESP-06 §3)
spring.application.name=cash-service

# Puerto configurable (PORT-CASH)
server.port=${CASH_PORT:9104}

# Datasource: esquema propio del servicio, credenciales solo por entorno
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT:3306}/gestion_cash?createDatabaseIfNotExist=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway: migraciones centralizadas en database/flyway/cash.
# La ruta es relativa al directorio del servicio (ESP-06 §3.1).
spring.flyway.enabled=true
spring.flyway.locations=filesystem:../../database/flyway/cash
spring.flyway.baseline-on-migrate=false

# JPA: el esquema lo administra Flyway, Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Cliente de catálogo (PORT-CATALOG visto por caja)
app.clients.catalog.url=${CATALOG_URL:http://localhost:9103}
# Timeout corto y configurable (ESP-03 §8, PLAN-04 T-04): caja no reintenta,
# falla explícito para no duplicar documentos.
app.clients.catalog.connect-timeout-ms=${CATALOG_CONNECT_TIMEOUT_MS:1500}
app.clients.catalog.read-timeout-ms=${CATALOG_READ_TIMEOUT_MS:3000}

# JWT: secreto compartido obligatorio (ESP-05 §2.2, §7). Sin valor por defecto:
# el servicio no debe arrancar si falta o mide menos de 32 caracteres.
app.jwt.secret=${JWT_SECRET}

# Actuator: solo health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# springdoc (ESP-08 §3)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
