spring.datasource.url=jdbc:h2:mem:cash_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Las pruebas no aplican Flyway: el esquema lo crea Hibernate en memoria.
spring.flyway.enabled=false

app.jwt.secret=SistemaGestionCibertec2026ClavePruebasJWT123456789

# El cliente de catálogo se mockea: nunca se llama por red en las pruebas.
app.clients.catalog.url=http://localhost:1
app.clients.catalog.connect-timeout-ms=500
app.clients.catalog.read-timeout-ms=500
