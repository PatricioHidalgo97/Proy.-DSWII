# catalog-service — configuración base (ESP-02 §3, ESP-06 §3)
spring.application.name=catalog-service

# Puerto configurable (PORT-CATALOG)
server.port=${CATALOG_PORT:9103}

# Datasource: esquema propio del servicio, credenciales solo por entorno
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT:3306}/gestion_catalog?createDatabaseIfNotExist=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway: migraciones centralizadas en database/flyway/catalog.
# La ruta es relativa al directorio del servicio (ESP-06 §3.1).
spring.flyway.enabled=true
spring.flyway.locations=filesystem:../../database/flyway/catalog
spring.flyway.baseline-on-migrate=false

# JPA: el esquema lo administra Flyway, Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Actuator: solo health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT: secreto compartido obligatorio (ESP-05 §2.2, §7). Sin valor por defecto:
# el servicio no debe arrancar si falta o mide menos de 32 caracteres.
# Catálogo solo valida el token; no consulta a identidad (ESP-01 §4).
app.jwt.secret=${JWT_SECRET}

# springdoc (ESP-08 §3)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
