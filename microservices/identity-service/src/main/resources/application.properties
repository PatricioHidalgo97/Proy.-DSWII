# identity-service — configuración base (ESP-02 §3, ESP-06 §3)
spring.application.name=identity-service

# Puerto configurable (PORT-AUTH)
server.port=${IDENTITY_PORT:9102}

# Datasource: esquema propio del servicio, credenciales solo por entorno
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT:3306}/gestion_auth?createDatabaseIfNotExist=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway: migraciones centralizadas en database/flyway/auth.
# La ruta es relativa al directorio del servicio (ESP-06 §3.1).
spring.flyway.enabled=true
spring.flyway.locations=filesystem:../../database/flyway/auth
spring.flyway.baseline-on-migrate=false

# JPA: el esquema lo administra Flyway, Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Actuator: solo health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
